name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack app source
        run: unzip whats-dail-source.zip -d whats-dail-source
      - name: Build debug APK
        run: gradle -p whats-dail-source assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: whats-dail-debug-apk
          path: whats-dail-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
